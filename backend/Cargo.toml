[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[dependencies]
alloy = { version = "2.5.0", features = ["full", "json"] }
eyre = "0.6.14"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
